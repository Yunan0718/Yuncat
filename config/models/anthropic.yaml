# 显示名取 display_name。没有这段时旧代码把 base_url(…/v1) 与 /v1/messages 直接相接，
# 健康检查会打到 …/v1/v1/messages 并必然 404。
protocol:
  auth:
    scheme: x-api-key
    headers:
      anthropic-version: '2023-06-01'
  models:
    list_key: data
    id_field: id
    name_field: display_name
    required:
      type: model

# Phase 75: Behavior 元数据注册表
#
# 作用：
#   1. 给 behavior 排序（priority 数字越大越优先）
#   2. 标记 applies_to（适用语言列表；空列表 = 通用）
#   3. commander._load_behaviors(selected_ids) 按 priority 排序加载选中 behavior
#
# 未在此 manifest 注册的 behavior（如未来新增的语言特定 behavior）默认 priority=50。
# manifest 缺失或解析失败时，commander 回退到 Phase 27 旧逻辑（按文件顺序加载）。


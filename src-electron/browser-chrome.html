<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Yuncat 浏览器</title>
<style>
  :root {
    --bg: #fcfcfd; --fg: #1f2328; --muted: #6b7280; --border: #e3e5e8;
    --field: #ffffff; --chip: #eef1f4; --accent: #2f6feb; --tab: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1c1f; --fg: #e6e8eb; --muted: #9aa1ab; --border: #303338;
      --field: #232529; --chip: #2a2d32; --accent: #6b9bff; --tab: #232529;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  .chrome { display: flex; flex-direction: column; height: 76px; }
  .tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0; height: 34px; overflow-x: auto; }
  .tab {
    display: flex; align-items: center; gap: 6px; max-width: 200px; height: 28px;
    padding: 0 8px; border: 1px solid var(--border); border-bottom: none;
    border-radius: 7px 7px 0 0; background: var(--tab); color: var(--muted); cursor: pointer;
  }
  .tab.active { background: var(--bg); color: var(--fg); font-weight: 600; }
  .tab .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .close { border: 0; background: none; color: inherit; cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
  .tab .close:hover { color: var(--fg); }
  .bar { display: flex; align-items: center; gap: 6px; padding: 0 8px 8px; height: 42px; }
  button.icon {
    width: 28px; height: 28px; flex: none; display: grid; place-items: center;
    border: 0; border-radius: 6px; background: none; color: var(--fg); cursor: pointer;
  }
  button.icon:hover { background: var(--chip); }
  button.icon:disabled { opacity: 0.35; cursor: default; }
  button.icon:disabled:hover { background: none; }
  svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .address { position: relative; flex: 1; }
  .address input {
    width: 100%; height: 28px; padding: 0 10px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--field); color: var(--fg);
    font: inherit; user-select: text; outline: none;
  }
  .address input:focus { border-color: var(--accent); }
  .hint {
    position: absolute; right: 10px; top: 6px; font-size: 11px; color: var(--muted);
  }
  .chip {
    flex: none; padding: 3px 8px; border-radius: 10px; background: var(--chip);
    color: var(--muted); font-size: 11px; white-space: nowrap;
  }
  .chip.agent { color: var(--accent); font-weight: 600; }
  .status { height: 0; overflow: hidden; }
</style>
</head>
<body>
  <div class="chrome">
    <div class="tabs" id="tabs"></div>
    <div class="bar">
      <button class="icon" id="back" title="后退">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon" id="forward" title="前进">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon" id="reload" title="刷新">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 6" stroke-linecap="round"/><path d="M20 5v6h-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="address">
        <input id="address" type="text" spellcheck="false" autocomplete="off"
               placeholder="输入网址，例如 github.com" title="只接受 http/https 网址" />
      </div>
      <span class="chip agent" id="agent" hidden>AI 正在操作</span>
      <button class="icon" id="newtab" title="新建标签页">
        <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <script src="browser-chrome.js"></script>
</body>
</html>

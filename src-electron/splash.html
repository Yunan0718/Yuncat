<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuncat 首次运行准备</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: #0f0f11;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 13px; color: #a1a1aa; margin-bottom: 24px; }
    .progress-bar {
      width: 280px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-inner {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .progress-text {
      margin-top: 12px;
      font-size: 12px;
      color: #71717a;
      min-height: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">Y</div>
  <h1>首次运行准备中</h1>
  <p>正在解压运行时组件，请稍候...</p>
  <div class="progress-bar"><div class="progress-bar-inner" id="bar"></div></div>
  <div class="progress-text" id="text">0%</div>
  <script>
    const bar = document.getElementById('bar');
    const text = document.getElementById('text');
    // Phase 49-H: 删除模拟动画——仅响应主进程 postMessage 真实解压进度
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'progress') {
        const pct = Math.floor(e.data.value || 0);
        bar.style.width = pct + '%';
        text.textContent = e.data.message
          ? `${pct}% — ${e.data.message}`
          : `${pct}%`;
      }
      if (e.data && e.data.type === 'done') {
        bar.style.width = '100%';
        text.textContent = '100%';
      }
    });
  </script>
</body>
</html>

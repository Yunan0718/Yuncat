name: Schema Principle Check

on:
  push:
    branches: [main]
    paths:
      - 'src-python/repositories/schema.py'
      - 'scripts/check_schema_principle.py'
      - '.github/workflows/schema-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-python/repositories/schema.py'
      - 'scripts/check_schema_principle.py'

jobs:
  schema-principle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[ci]"
      - run: python scripts/check_schema_principle.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
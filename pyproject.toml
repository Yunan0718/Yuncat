[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Yuncat backend is executed from src-python/ directly; this project is used
# for dependency locking and optional test runners only.
py-modules = []

[project]
name = "yuncat-backend"
version = "0.1.3"
description = "Yuncat AI Agent Platform — Python backend (Electron 42 + FastAPI)"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.23,<1",
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.19,<1",
    "pyyaml>=6.0,<7",
    "cryptography>=41.0,<45",
    "psutil>=5.9,<7",
    "watchdog>=4.0,<7",
    "pydantic>=2.0,<3",  # H16 修复：显式声明（13 个文件直接 import，原为幽灵依赖）
    "pydantic-settings>=2.0,<3",
    # CodeWhale 借鉴: tiktoken 精确 token 计数（对标 Codex CLI / Claude Code 本地 tokenizer）
    # 用于 token_budget.estimate_tokens() —— 压缩触发 / 成本估算 / 上下文预算派生
    "tiktoken>=0.7,<1",
    # Windows 交互式终端（PTY）。注意 1.x 的导入名是 pywinpty、2.x+ 是 winpty，
    # 代码里两个名字都试。缺了它不会报错，只会静默降级成管道模式（没提示符、
    # 没回显），所以显式声明，别让终端能不能用取决于装机时有没有人手动装过。
    "pywinpty>=2.0,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
# chromadb 需要 C++ 编译工具；生产/向量检索环境请安装 .[vector]
vector = ["chromadb>=0.4,<1"]
dev = [
    "pytest>=7.0,<9",
    "pytest-asyncio>=0.21,<1",
    "pytest-cov>=4.0,<7",
]
test = [
    "pytest>=7.0,<9",
    "pytest-asyncio>=0.21,<1",
    "pytest-cov>=4.0,<7",
    "httpx>=0.24,<1",
    "aiohttp>=3.9,<4",
    "pyyaml>=6.0,<7",
]
ci = [
    "pytest>=7.0,<9",
    "aiosqlite>=0.19,<1",
]
all = [
    "chromadb>=0.4,<1",
]

# ── T10: pytest-cov 覆盖率配置 ──
# 主流做法：源/排除项在此声明，CI 跑 `pytest --cov=src-python`，
# 本地可选 `pytest --cov=src-python --cov-report=term-missing` 或加 `--no-cov` 跳过。
# 不强制写入 pytest.ini addopts——避免每次本地 pytest 慢 20-30%（对标 FastAPI/Django）。
[tool.coverage.run]
source = ["src-python"]
branch = true
omit = [
    "src-python/node-embed/*",   # vendored Node.js + hermes-agent + openclaw（dev-only）
    "src-python/tools/lint_rules.py",  # 独立 CLI 脚本，非运行时模块
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]